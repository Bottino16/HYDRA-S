<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDA | Login do Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0d1117; --card-bg: #161b22; --border: #30363d;
            --text-main: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
            --danger: #da3633;
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main);
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .login-box {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 40px; width: 100%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo-icon { font-size: 48px; color: var(--accent); margin-bottom: 10px; }
        h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: 600; }
        p { color: var(--text-dim); font-size: 13px; margin-bottom: 30px; }

        input {
            width: 100%; background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border);
            padding: 12px; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 15px;
            transition: 0.2s;
        }
        input:focus { border-color: var(--accent); }

        .btn-login {
            width: 100%; background: var(--accent); color: #0d1117; font-weight: 700; border: none;
            padding: 12px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .btn-login:hover { background: #79c0ff; }

        #mensagem-erro { color: var(--danger); font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <i class="ph ph-drop logo-icon"></i>
        <h2>Acesso Restrito</h2>
        <p>Sistema de Irrigação Inteligente</p>

        <input type="text" id="campo-usuario" placeholder="Nome de Usuário" autocomplete="username" aria-label="Usuário">
        <input type="password" id="campo-senha" autocomplete="current-password" aria-label="Senha" placeholder="Senha">
        
        <button class="btn-login" id="entrar">Entrar</button>

        <div role="alert" id="mensagem-erro">Usuário ou senha incorretos.</div>
    </div>

    <script src="/login.js"></script>
</body></html>
